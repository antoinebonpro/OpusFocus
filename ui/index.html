<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="__TOKEN__">
  <meta name="color-scheme" content="dark light">
  <title>OpusFocus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1814'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2322c870' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2322c870'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg>
        <div><div class="brand-name">Opus</div><div class="brand-sub">Focus</div></div>
      </div>
      <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
      <div class="side-status" id="side-status" aria-live="polite"></div>
      <section class="player" id="player" aria-label="Musique focus"></section>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="offline" id="offline" hidden>
    <div class="offline-card">
      <h2>Reconnexion au moteur…</h2>
      <p>Si ce message reste affiché, relance <strong>OpusFocus</strong> : cette fenêtre se reconnectera toute seule. Tes sessions et tes réglages sont conservés.</p>
    </div>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
